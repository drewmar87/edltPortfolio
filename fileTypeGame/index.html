<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>File Type Identifier Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="game-container">
  <div id="instructions">
    <h1>File Type Identifier</h1>
    <p>Drag the file icon to the matching category.</p>
  </div>
  <div id="game-content">
    <div id="categories-top" class="categories-container">
      <!-- 5 top categories here -->
      <div class="category" data-category="Document Files">Documents</div>
      <div class="category" data-category="Image Files">Images</div>
      <div class="category" data-category="Audio Files">Audio</div>
      <div class="category" data-category="Video Files">Video</div>
      <div class="category" data-category="Source Code Files">Source Code Files</div>
    </div>

    <div id="file-stack-container">
      <div id="file-stack">
        <div class="file-layer" id="file-layer-1"></div>
        <div class="file-layer" id="file-layer-2"></div>
        <div class="file-layer" id="file-layer-3"></div>
      </div>
    </div>

    <div id="categories-bottom" class="categories-container">
      <!-- 4 bottom categories here -->
      <div class="category" data-category="Compressed Files">Compressed Files</div>
      <div class="category" data-category="Executable Files">Executables</div>
      <div class="category" data-category="Font Files">Fonts</div>
      <div class="category" data-category="3D Model Files">3D Model Files</div>
    </div>
  </div>

  <div id="score-container">
    <div id="score">
      <span class="score-box">Correct: <span id="correct-count">0</span></span>
      <span class="score-box">Incorrect: <span id="incorrect-count">0</span></span>
      <span class="score-box">Accuracy: <span id="accuracy">0%</span></span>
    </div>
  </div>
</div>

  <script src="script.js"></script>
</body>
</html>
